<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#334155" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.5"/>
  <!-- circuit trace with a resistor -->
  <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760 210 H850 L862 190 L882 230 L902 190 L922 230 L942 190 L954 210 H1040 V120 H1110"/>
  </g>
  <circle cx="760" cy="210" r="8" fill="#facc15"/>
  <circle cx="1110" cy="120" r="8" fill="#fb923c"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="70" y="90" fill="#94a3b8" font-size="26">$ python tools/<tspan fill="#facc15">anything</tspan>.py</text>
    <text x="66" y="175" fill="#f8fafc" font-size="78" font-weight="700">pocket<tspan fill="url(#accent)">-tools</tspan></text>
    <text x="70" y="230" fill="#cbd5e1" font-size="28">10 tiny tools · ~50 lines each · zero dependencies</text>
  </g>
</svg>
